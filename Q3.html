<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Counterparty crash configurations and average hospitalizations</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>

</head>

<body>
    <div class="presentation-container">

        <div class="slide active" id="slide-chart">
            <div class="navbar">

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospitalisations by road user type</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <div class="presentation-container">
        <div class="slide active" id="slide-chart">
            <div class="navbar">
                <a href="index.html">Home Page</a>
                <a href="about.html">About</a>
                <a href="appendix.html">Appendix</a>
            </div>

            <div class="chart-page-content">
                <div class="chart-header">
                    <div>
                        <h2>Which road user groups account for the most hospitalisations?</h2>
                        <p class="subtitle">Compare hospitalisations by road user type. Switch between total numbers and each group’s share of the dataset.</p>
                    </div>
                    <div class="metric-controls" role="group" aria-label="Chart measure">
                        <button class="btn metric-btn active" type="button" data-metric="count" aria-pressed="true">Total number</button>
                        <button class="btn metric-btn" type="button" data-metric="percentage" aria-pressed="false">Percentage</button>
                    </div>
                </div>
                <p class="subtitle" id="q2-total" aria-live="polite"></p>
                <div id="q2-chart" class="chart-card">
                    <p class="chart-error">Loading road user data…</p>
                </div>
            </div>
        </div>
    </div>

    <a href="Q3.html" class="btn floating-next-btn">Next →</a>
    <div id="chart-tooltip" class="tooltip"></div>
    <script src="js/Q2chart.js"></script>
</body>
</html>
